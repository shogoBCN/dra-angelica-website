# =============================================================================
# Campaign: 16-aug-26 — Facebook short-video scene stills (4:5 Feed + 9:16 Reels)
# =============================================================================
#
# Short cut skips Google scenes 2–4 (specialist offices). Scene 5 must NOT say
# "Tres mundos". Scene 1 may still say "Tres especialistas" (three cards in shot).
# No phone numbers. Meta-safer "tú"/diagnosis copy.
#
#   python gemini_batch.py configs/16-aug-26-facebook-video.yaml --dry-run
#   python gemini_batch.py configs/16-aug-26-facebook-video.yaml --pro
#   python gemini_batch.py configs/16-aug-26-facebook-video.yaml --job scene-5 --skip-existing
#
# =============================================================================

defaults:
  model: pro
  references:
    - ads/GoogleAds/08-aug-26/video/initials/REFERENCE_patient.png
    - ads/GoogleAds/08-aug-26/video/initials/REFERENCE_text-style.png

fragments:
  fb_video_style: |
    TYPOGRAPHY — elegant serif, left-aligned. Navy #1e3a5f. Teal #4aada8 ONLY on
    the highlight word below. Short teal underline under that word only.
    No box, no banner, no header strip, no split layout, no scene numbers.
    IGNORE and DO NOT copy the OLD headline from the reference photos.

    PHOTO LOCK: same people, clothes, room, props, lighting as the attached scene.
    Grayscale photo (except scene 8 full color, and scene 6 red warning triangles).
    Do not invent a new patient or doctor.

  fb_4x5: |
    COMPOSITION 4:5: Recreate the attached 1:1 as a taller 4:5 photograph.
    Magenta bands on the padded reference are empty canvas — outpaint REAL room
    (ceiling / floor / wall) there. Do NOT stretch faces. Headline size same as 1:1.

  fb_9x16: |
    COMPOSITION 9:16: Upscale the attached 9:16 to sharp photorealistic 2K.
    Use the attached 1:1 for face and prop detail. Full-bleed photo.
    STORIES SAFE ZONE: headline starts ~16–18% from the top (below username chrome).
    Do NOT put a CTA button in the bottom 20% of the frame.

jobs:
  # ---------------------------------------------------------------------------
  # Scene 1 — kitchen. "Tres" is earned: three appointment cards are visible.
  # ---------------------------------------------------------------------------
  - id: scene-1
    source: ads/GoogleAds/08-aug-26/video/1x1/scene_1.png
    output_dir: ads/FacebookAds/16-aug-26/video
    references:
      - ads/GoogleAds/08-aug-26/video/1x1/scene_1.png
    fragments:
      copy: |
        EXACT NEW HEADLINE (replace the old "tú en el medio" line — do not keep it):
        Line 1 navy: Tres especialistas.
        Line 2 navy: Tres tratamientos.
        Line 3 navy "¿Quién mira el " + teal "conjunto?"
        Short teal underline under "conjunto?" only.
        Upper-left on kitchen wall/cabinets. Must NOT cover the patient's face.

    outputs:
      - aspect_ratio: "4:5"
        path: 4x5/scene_1.png
        pad_source: true
        prompt: |
          TASK: Photorealistic 4:5 Facebook still of attached scene 1. REPLACE headline only.

          {copy}

          {fb_video_style}

          {fb_4x5}

          KEEP: stressed patient, kitchen table, pill bottles, three cards
          CITA CARDIOLOGÍA · CITA ENDOCRINOLOGÍA · CITA REUMATOLOGÍA, grayscale.

          DO NOT: old "tú en el medio" copy, color photo, stretch faces, phone number.

      - aspect_ratio: "9:16"
        path: 9x16/scene_1.png
        source: ads/GoogleAds/08-aug-26/video/9x16/scene_1.png
        prompt: |
          TASK: Sharp 9:16 Facebook still of scene 1. REPLACE headline only. Upscale.

          {copy}

          {fb_video_style}

          {fb_9x16}

          KEEP: same patient, table, three appointment cards, grayscale.

          DO NOT: old "tú en el medio" copy, color photo, banner bar, phone number.

  # ---------------------------------------------------------------------------
  # Scene 5 — hallway. NOT "Tres mundos" (that needed skipped scenes 2–4).
  # ---------------------------------------------------------------------------
  - id: scene-5
    source: ads/GoogleAds/08-aug-26/video/1x1/scene_5.png
    output_dir: ads/FacebookAds/16-aug-26/video
    references:
      - ads/GoogleAds/08-aug-26/video/1x1/scene_5.png
    fragments:
      copy: |
        EXACT NEW HEADLINE (do NOT write "Tres mundos", "tú", or "sola"):
        Line 1 navy: Especialistas
        Line 2 navy: que no se hablan.
        Line 3 navy "Nadie mira el " + teal "conjunto."
        Short teal underline under "conjunto." only.
        Upper-left on hallway wall/ceiling. Must NOT cover the patient's face.

    outputs:
      - aspect_ratio: "4:5"
        path: 4x5/scene_5.png
        pad_source: true
        prompt: |
          TASK: Photorealistic 4:5 Facebook still of attached hallway scene. REPLACE headline only.

          {copy}

          {fb_video_style}

          {fb_4x5}

          KEEP: patient with folders in hospital hallway, three specialty doors,
          question marks, grayscale.

          FORBIDDEN WORDS ON IMAGE: Tres, mundos, tú, sola, TRES.
          DO NOT: old headline, color photo, stretch faces, phone number.

      - aspect_ratio: "9:16"
        path: 9x16/scene_5.png
        source: ads/GoogleAds/08-aug-26/video/9x16/scene_5.png
        prompt: |
          TASK: Sharp 9:16 Facebook still of the hallway scene. REPLACE headline only.

          {copy}

          {fb_video_style}

          {fb_9x16}

          KEEP: same patient, three doors, folders, grayscale.

          FORBIDDEN WORDS ON IMAGE: Tres, mundos, tú, sola, TRES.
          DO NOT: old "Tres mundos" headline, banner bar, phone number.

  # ---------------------------------------------------------------------------
  # Scene 6 — contradictory plans. Not "¿Cuál plan sigo?" / "Los tres".
  # ---------------------------------------------------------------------------
  - id: scene-6
    source: ads/GoogleAds/08-aug-26/video/1x1/scene_6.png
    output_dir: ads/FacebookAds/16-aug-26/video
    references:
      - ads/GoogleAds/08-aug-26/video/1x1/scene_6.png
    fragments:
      copy: |
        EXACT NEW HEADLINE (do NOT write "Cuál plan sigo" or "Los tres"):
        Line 1 navy: Planes que se contradicen.
        Line 2 navy "Hace falta quien los " + teal "cruce."
        Short teal underline under "cruce." only.
        Upper-left on wall. Must NOT cover the patient's face.

    outputs:
      - aspect_ratio: "4:5"
        path: 4x5/scene_6.png
        pad_source: true
        prompt: |
          TASK: Photorealistic 4:5 Facebook still of attached scene 6. REPLACE headline only.

          {copy}

          {fb_video_style}

          {fb_4x5}

          KEEP: patient at table, three PLAN TRATAMIENTO notebooks with RED
          INTERACCIÓN MEDICAMENTOSA warnings, pill bottles, grayscale + red only.

          DO NOT: old "Cuál plan sigo" copy, drop red warnings, stretch faces, phone number.

      - aspect_ratio: "9:16"
        path: 9x16/scene_6.png
        source: ads/GoogleAds/08-aug-26/video/9x16/scene_6.png
        prompt: |
          TASK: Sharp 9:16 Facebook still of scene 6. REPLACE headline only.

          {copy}

          {fb_video_style}

          {fb_9x16}

          KEEP: three plans with red interaction warnings, patient, grayscale + red.

          DO NOT: old "Cuál plan sigo" / "Los tres" copy, drop red warnings, phone number.

  # ---------------------------------------------------------------------------
  # Scene 7 — Angélica. Copy already Meta-safe; new aspects + 9:16 upscale.
  # ---------------------------------------------------------------------------
  - id: scene-7
    source: ads/GoogleAds/08-aug-26/video/1x1/scene_7.png
    output_dir: ads/FacebookAds/16-aug-26/video
    use_default_references: false
    references:
      - ads/GoogleAds/08-aug-26/samples/v2/REFERENCE_angelica-ad05-face.png
      - ads/GoogleAds/08-aug-26/video/1x1/scene_7.png
    fragments:
      copy: |
        VISIBLE HEADLINE — paint these Spanish words ONLY. No hex codes. No "#".
        Line 1: Un médico que
        Line 2: ve el cuadro completo
        Line 3: y habla con todos.
        Color the letters navy except the word "todos." which is teal, with a short teal underline under "todos." only.
        FORBIDDEN AS VISIBLE TEXT: #1e3a5f #4aada8 #4aadas navy teal hex RGB any hash-number.
        Coat embroidery: "Dra. Angélica" / "Medicina de Familia". Do not cover her face.

    outputs:
      - aspect_ratio: "4:5"
        path: 4x5/scene_7.png
        pad_source: true
        prompt: |
          TASK: Photorealistic 4:5 Facebook still of attached scene 7. Same copy, taller frame.

          {copy}

          {fb_video_style}

          {fb_4x5}

          KEEP: Dra. Angélica face, white coat, stethoscope, circular care diagram
          (PACIENTE, CARDIOLOGÍA, ENDOCRINOLOGÍA, REUMATOLOGÍA, NUTRICIÓN, SALUD MENTAL, FAMILIA).
          She is FULL COLOR — not grayscale.

          DO NOT: different doctor, shrink diagram, phone number, grayscale Angélica.

      - aspect_ratio: "9:16"
        path: 9x16/scene_7.png
        source: ads/GoogleAds/08-aug-26/video/9x16/scene_7.png
        prompt: |
          TASK: Sharp 9:16 Facebook still of scene 7. Same copy. Upscale.

          {copy}

          {fb_video_style}

          {fb_9x16}

          KEEP: same Angélica, full circular diagram, full color on her.

          DO NOT: different face, remove diagram, phone number.

  # ---------------------------------------------------------------------------
  # Scene 8 — CTA. No phone. WhatsApp line instead of "Llámame ahora: 310…"
  # ---------------------------------------------------------------------------
  - id: scene-8
    source: ads/GoogleAds/08-aug-26/video/1x1/scene_8.png
    output_dir: ads/FacebookAds/16-aug-26/video
    references:
      - ads/GoogleAds/08-aug-26/video/1x1/scene_8.png
      - web/assets/images/brand/logo-teal.png
    fragments:
      copy: |
        EXACT HEADLINE:
        Line 1 navy: Un plan.
        Line 2 navy "Una " + teal "vida mejor."
        Short teal underline under "vida mejor." only.

        CTA (teal rounded rectangle, white sans-serif) — NO phone number:
        Escríbeme por WhatsApp

        FORBIDDEN ON IMAGE: 310, 770, 0625, Llámame, any digit sequence.
        Keep clipboard PLAN DE TRATAMIENTO INTEGRAL, checklist, family, logo
        Dra. Angélica · Medicina de Familia · La Mesa. FULL COLOR golden hour.

    outputs:
      - aspect_ratio: "4:5"
        path: 4x5/scene_8.png
        pad_source: true
        prompt: |
          TASK: Photorealistic 4:5 Facebook CTA still. REPLACE phone CTA with WhatsApp. No number.

          {copy}

          {fb_video_style}

          {fb_4x5}

          KEEP: smiling patient + family in park, clipboard, checklist, logo, full color.
          Put the WhatsApp button where the old "Llámame" button was (not on faces).

          DO NOT: phone number, Llámame, grayscale, different faces.

      - aspect_ratio: "9:16"
        path: 9x16/scene_8.png
        source: ads/GoogleAds/08-aug-26/video/9x16/scene_8.png
        prompt: |
          TASK: Sharp 9:16 Facebook CTA still. REPLACE phone CTA with WhatsApp. No number.

          {copy}

          {fb_video_style}

          {fb_9x16}

          KEEP: same family, clipboard, checklist, logo, full color.
          WhatsApp button in the MIDDLE third of the frame (Stories: bottom 20% is chrome).
          Headline ~16–18% from top.

          DO NOT: phone number, Llámame, CTA on the bottom edge, different faces.
